# Builds the universal app and publishes a .dmg to GitHub Releases.
# Push a tag like v1.2.0 to release; run it by hand to just get the .dmg as an artifact.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swiftc --version

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-${GITHUB_SHA::7}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Build .dmg
        run: make dmg VERSION=${{ steps.version.outputs.value }}

      - name: Keep the .dmg as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atrapando-el-Tiempo-${{ steps.version.outputs.value }}
          path: build/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/*.dmg \
            --title "Atrapando el tiempo × Caradekid ${GITHUB_REF_NAME}" \
            --notes-file dist/release-notes.md
