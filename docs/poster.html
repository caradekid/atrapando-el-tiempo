<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Atrapando el tiempo · README images</title>
  <!--
    Composes the README images with the real engine. Rendered to PNG by:
      build/render --page docs/<name>.png docs/poster.html "Poster.<name>()"
    or open it in a browser and call Poster.<name>() from the console.
  -->
</head>
<body style="margin:0;background:#111">
  <script src="../web/gl.js"></script>
  <script src="../web/engine.js"></script>
  <script>
  (function () {
    'use strict';
    const E = TourbillonEngine;
    const SERIF = '"Didot","Bodoni 72",serif';
    const SANS = '"Avenir Next","Helvetica Neue",sans-serif';
    const at = (h, m, s) => { const t = new Date(); t.setHours(h, m, s || 31, 0); return t; };
    const cfgOf = (model, extra) => Object.assign({}, E.DEFAULTS, E.MODELS[model].defaults, { model, light: 'fixed', emblem: 'printed' }, extra || {});
    const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
    const png = (c) => c.toDataURL('image/png').split(',')[1];

    function spaced(ctx, text, x, y, spacing) {
      const chars = [...text];
      const widths = chars.map((ch) => ctx.measureText(ch).width);
      let cx = x - (widths.reduce((a, b) => a + b, 0) + spacing * (chars.length - 1)) / 2;
      ctx.textAlign = 'left';
      chars.forEach((ch, i) => { ctx.fillText(ch, cx, y); cx += widths[i] + spacing; });
      ctx.textAlign = 'center';
    }
    function scene(ctx, w, h, dark, style, cx, cy, R, bgLight, bgDark) {
      E.drawBackground(ctx, w, h, Object.assign({}, E.DEFAULTS, { background: style, bgLight: bgLight || E.DEFAULTS.bgLight, bgDark: bgDark || E.DEFAULTS.bgDark }), dark, cx, cy, R);
    }
    function label(ctx, text, x, y, size, color, font, spacing) {
      ctx.fillStyle = color;
      ctx.font = `${size}px ${font || SANS}`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (spacing) spaced(ctx, text, x, y, spacing); else ctx.fillText(text, x, y);
    }

    const Poster = {
      // Wide hero: three watches on a dark studio set, with the title.
      hero(w = 2400, h = 1260) {
        const c = canvas(w, h), ctx = c.getContext('2d');
        scene(ctx, w, h, true, 'spotlight', w / 2, h * 0.64, h * 0.42);
        label(ctx, 'ATRAPANDO EL TIEMPO', w / 2, h * 0.11, h * 0.062, '#f2efe8', SERIF, h * 0.016);
        label(ctx, '× Caradekid', w / 2, h * 0.19, h * 0.032, 'rgba(242,239,232,0.7)', `italic ${SERIF}`);
        const t = at(10, 10);
        E.renderWatch(ctx, w * 0.17, h * 0.63, h * 0.235, cfgOf('seventies'), false, t);
        E.renderWatch(ctx, w * 0.83, h * 0.63, h * 0.235, cfgOf('cocktail'), false, t);
        E.renderWatch(ctx, w * 0.5, h * 0.6, h * 0.33, cfgOf('giltDiver'), true, t);
        return png(c);
      },

      // Every dial, by origin, with its name.
      collection(cols = 6, cell = 400) {
        const ids = Object.keys(E.MODELS);
        const rows = Math.ceil(ids.length / cols);
        const head = 170, foot = 40, w = cols * cell, h = head + rows * (cell + 56) + foot;
        const c = canvas(w, h), ctx = c.getContext('2d');
        scene(ctx, w, h, false, 'studio', w / 2, h * 0.4, w * 0.35);
        label(ctx, `${ids.length} ESFERAS · ${ids.length} DIALS`, w / 2, 70, 46, '#2a2620', SERIF, 12);
        label(ctx, 'Japón · Suiza · España', w / 2, 125, 28, 'rgba(42,38,32,0.65)', `italic ${SERIF}`);
        const t = at(10, 10);
        ids.forEach((id, i) => {
          const x = (i % cols) * cell + cell / 2, y = head + Math.floor(i / cols) * (cell + 56) + cell / 2;
          E.renderWatch(ctx, x, y, cell * 0.42, cfgOf(id, { wordmark: '', subline: '' }), false, t);
          const m = E.MODELS[id];
          label(ctx, m.name, x, y + cell * 0.5 + 8, 26, '#2a2620', SANS);
          label(ctx, m.origin === 'Japan' ? 'Japón' : m.origin === 'Switzerland' ? 'Suiza' : 'España', x, y + cell * 0.5 + 40, 20, 'rgba(42,38,32,0.55)', SANS);
        });
        return png(c);
      },

      // The same watch by day and by night.
      lightDark(w = 2400, h = 1100) {
        const c = canvas(w, h), ctx = c.getContext('2d');
        const half = canvas(w / 2, h), hc = half.getContext('2d');
        const t = at(10, 10);
        scene(hc, w / 2, h, false, 'studio', w / 4, h * 0.5, h * 0.36);
        E.renderWatch(hc, w / 4, h * 0.52, h * 0.36, cfgOf('snowfield'), false, t);
        label(hc, 'MODO CLARO', w / 4, h * 0.075, 34, '#2a2620', SERIF, 8);
        ctx.drawImage(half, 0, 0);
        scene(hc, w / 2, h, true, 'studio', w / 4, h * 0.5, h * 0.36);
        E.renderWatch(hc, w / 4, h * 0.52, h * 0.36, cfgOf('snowfield'), true, t);
        label(hc, 'MODO OSCURO', w / 4, h * 0.075, 34, '#f2efe8', SERIF, 8);
        ctx.drawImage(half, w / 2, 0);
        return png(c);
      },

      // The key light follows the clock: morning, noon, evening, night.
      hours(w = 2400, h = 760) {
        const c = canvas(w, h), ctx = c.getContext('2d');
        scene(ctx, w, h, false, 'solid', w / 2, h / 2, h, '#e7e3dc');
        const times = [[8, 0, 'Mañana'], [13, 0, 'Mediodía'], [18, 45, 'Atardecer'], [23, 0, 'Noche']];
        times.forEach(([hh, mm, name], i) => {
          const x = w * (0.125 + i * 0.25), y = h * 0.45;
          E.renderWatch(ctx, x, y, h * 0.33, cfgOf('datum', { light: 'time' }), hh >= 21, at(hh, mm, 20));
          label(ctx, name, x, h * 0.88, 34, '#2a2620', SERIF);
          label(ctx, `${hh}:${String(mm).padStart(2, '0')}`, x, h * 0.94, 24, 'rgba(42,38,32,0.55)', SANS);
        });
        return png(c);
      },

      // Macro: textures rendered on the GPU, seen up close.
      macro(w = 2400, h = 860) {
        const c = canvas(w, h), ctx = c.getContext('2d');
        scene(ctx, w, h, true, 'solid', w / 2, h / 2, h, undefined, '#0e0f11');
        const tiles = [
          ['octagon', true, 'Tapisserie', [-0.62, -0.62]],
          ['snowfield', false, 'Nieve · Snow', [-0.55, -0.7]],
          ['giltDiver', true, 'Gilt · lume', [-0.72, -0.35]],
        ];
        const size = 720, gap = (w - size * 3) / 4, R = 1300;
        tiles.forEach(([id, dark, name, [fx, fy]], i) => {
          const tile = canvas(size, size), tc = tile.getContext('2d');
          tc.fillStyle = dark ? '#0e0f11' : '#ece9e3';
          tc.fillRect(0, 0, size, size);
          E.renderWatch(tc, size / 2 - fx * R, size / 2 - fy * R, R, cfgOf(id, { wordmark: '', subline: '', emblem: 'none' }), dark, at(10, 10));
          const x = gap + i * (size + gap), y = (h - size) / 2 - 20;
          ctx.save();
          ctx.beginPath();
          ctx.roundRect(x, y, size, size, 36);
          ctx.clip();
          ctx.drawImage(tile, x, y);
          ctx.restore();
          label(ctx, name, x + size / 2, y + size + 46, 30, 'rgba(242,239,232,0.85)', SERIF);
        });
        return png(c);
      },
    };
    window.Poster = Poster;
  })();
  </script>
</body>
</html>
